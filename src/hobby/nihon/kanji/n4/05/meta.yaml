page:
  title: "Хобби"
  type: "kanji"

kanji:
  - char: "映"
    readings: "えい, うつ"
    meaning: "Отражать, проецировать"
    examples:
      - kanji: "映します"
        reading: "うつします"
        meaning: "Отражать, проецировать"
      - kanji: "映画"
        reading: "えいが"
        meaning: "Кино, фильм"
      - kanji: "映画館"
        reading: "えいがかん"
        meaning: "Кинотеатр"

  - char: "画"
    readings: "が, かく"
    meaning: "Картина, рисунок, план"
    examples:
      - kanji: "画家"
        reading: "がか"
        meaning: "Художник"
      - kanji: "日本画"
        reading: "にほんが"
        meaning: "Японская живопись"
      - kanji: "映画"
        reading: "えいが"
        meaning: "Кино, фильм"
      - kanji: "計画"
        reading: "けいかく"
        meaning: "План"

  - char: "音"
    readings: "おと, おん"
    meaning: "Звук"
    examples:
      - kanji: "音"
        reading: "おと"
        meaning: "Звук"
      - kanji: "発音"
        reading: "はつおん"
        meaning: "Произношение"
      - kanji: "高音"
        reading: "こうおん"
        meaning: "Высокая нота"
      - kanji: "音楽"
        reading: "おんがく"
        meaning: "Музыка"

  - char: "楽"
    readings: "たの, がく, らく"
    meaning: "Приятный, лёгкий, музыка"
    examples:
      - kanji: "楽しい"
        reading: "たのしい"
        meaning: "Приятный, весёлый"
      - kanji: "音楽"
        reading: "おんがく"
        meaning: "Музыка"
      - kanji: "楽"
        reading: "らく"
        meaning: "Лёгкий, просто"

  - char: "歌"
    readings: "うた, か"
    meaning: "Песня"
    examples:
      - kanji: "歌います"
        reading: "うたいます"
        meaning: "Петь"
      - kanji: "歌手"
        reading: "かしゅ"
        meaning: "Певец, певица"

  - char: "写"
    readings: "しゃ, うつ"
    meaning: "Копировать, фотографировать"
    examples:
      - kanji: "写します"
        reading: "うつします"
        meaning: "Копировать, переписывать"
      - kanji: "写真"
        reading: "しゃしん"
        meaning: "Фотография"

  - char: "真"
    readings: "しん, ま, まっ"
    meaning: "Истина, настоящий"
    examples:
      - kanji: "写真"
        reading: "しゃしん"
        meaning: "Фотография"
      - kanji: "真実"
        reading: "しんじつ"
        meaning: "Правда, истина"
      - kanji: "真ん中"
        reading: "まんなか"
        meaning: "Центр, середина"
      - kanji: "真っ白"
        reading: "まっしろ"
        meaning: "Совершенно белый"

  - char: "旅"
    readings: "たび, りょ"
    meaning: "Путешествие"
    examples:
      - kanji: "旅"
        reading: "たび"
        meaning: "Путешествие, поездка"
      - kanji: "旅行"
        reading: "りょこう"
        meaning: "Путешествие"
      - kanji: "旅行します"
        reading: "りょこうします"
        meaning: "Путешествовать"
      - kanji: "旅館"
        reading: "りょかん"
        meaning: "Гостиница (в японском стиле)"

  - char: "世"
    readings: "せ, せい, よ"
    meaning: "Мир, общество"
    examples:
      - kanji: "世界"
        reading: "せかい"
        meaning: "Мир, Земля"
      - kanji: "世話"
        reading: "せわ"
        meaning: "Забота, уход, помощь"
      - kanji: "21世紀"
        reading: "21せいき"
        meaning: "21-й век"
      - kanji: "世の中"
        reading: "よのなか"
        meaning: "Мир, общество"

  - char: "界"
    readings: "かい"
    meaning: "Мир, граница, сфера"
    examples:
      - kanji: "世界"
        reading: "せかい"
        meaning: "Мир, Земля"
      - kanji: "政界"
        reading: "せいかい"
        meaning: "Политический мир"
