page:
  title: "Время"
  type: "kanji"

kanji:
  - char: "曜"
    readings: "よう"
    meaning: "День недели"
    examples:
      - kanji: "月曜日"
        reading: "げつようび"
        meaning: "Понедельник"
      - kanji: "火曜日"
        reading: "かようび"
        meaning: "Вторник"

  - char: "昼"
    readings: "ひる, ちゅう"
    meaning: "День, полдень"
    examples:
      - kanji: "昼"
        reading: "ひる"
        meaning: "Полдень, день"
      - kanji: "昼休み"
        reading: "ひるやすみ"
        meaning: "Обеденный перерыв"
      - kanji: "昼ご飯"
        reading: "ひるごはん"
        meaning: "Обед"
      - kanji: "昼食"
        reading: "ちゅうしょく"
        meaning: "Обед"

  - char: "夜"
    readings: "よる, よ, や"
    meaning: "Ночь"
    examples:
      - kanji: "夜"
        reading: "よる"
        meaning: "Ночь"
      - kanji: "今夜"
        reading: "こんや"
        meaning: "Сегодня вечером, этой ночью"
      - kanji: "夜店"
        reading: "よみせ"
        meaning: "Ночной ларёк"
      - kanji: "夜食"
        reading: "やしょく"
        meaning: "Поздний ужин, ночной перекус"

  - char: "方"
    readings: "かた, がた, ほう"
    meaning: "Направление, сторона, способ"
    examples:
      - kanji: "読み方"
        reading: "よみかた"
        meaning: "Способ чтения"
      - kanji: "夕方"
        reading: "ゆうがた"
        meaning: "Вечер"
      - kanji: "あの方"
        reading: "あのかた"
        meaning: "Тот человек"
      - kanji: "方法"
        reading: "ほうほう"
        meaning: "Метод, способ"

  - char: "夕"
    readings: "ゆう"
    meaning: "Вечер"
    examples:
      - kanji: "夕日"
        reading: "ゆうひ"
        meaning: "Закат"
      - kanji: "夕食"
        reading: "ゆうしょく"
        meaning: "Ужин"
      - kanji: "七夕"
        reading: "たなばた"
        meaning: "Танабата (Фестиваль звёзд)"

  - char: "晩"
    readings: "ばん"
    meaning: "Вечер"
    examples:
      - kanji: "今晩"
        reading: "こんばん"
        meaning: "Сегодня вечером"
      - kanji: "毎晩"
        reading: "まいばん"
        meaning: "Каждый вечер"
      - kanji: "晩ご飯"
        reading: "ばんごはん"
        meaning: "Ужин"

  - char: "計"
    readings: "けい, はか"
    meaning: "Измерять, план"
    examples:
      - kanji: "時計"
        reading: "とけい"
        meaning: "Часы"
      - kanji: "計画"
        reading: "けいかく"
        meaning: "План"
      - kanji: "計ります"
        reading: "はかります"
        meaning: "Измерять"
      - kanji: "合計"
        reading: "ごうけい"
        meaning: "Итого, общая сумма"

  - char: "朝"
    readings: "あさ, ちょう"
    meaning: "Утро"
    examples:
      - kanji: "朝"
        reading: "あさ"
        meaning: "Утро"
      - kanji: "今朝"
        reading: "けさ"
        meaning: "Сегодня утром"
      - kanji: "朝日"
        reading: "あさひ"
        meaning: "Утреннее солнце"
      - kanji: "朝食"
        reading: "ちょうしょく"
        meaning: "Завтрак"

  - char: "以"
    readings: "い"
    meaning: "С, начиная с, посредством"
    examples:
      - kanji: "以上"
        reading: "いじょう"
        meaning: "Более чем, выше"
      - kanji: "以下"
        reading: "いか"
        meaning: "Менее чем, ниже"
      - kanji: "以外"
        reading: "いがい"
        meaning: "Кроме, за исключением"
      - kanji: "以前"
        reading: "いぜん"
        meaning: "Раньше, до"
      - kanji: "以内"
        reading: "いない"
        meaning: "В пределах, внутри"

  - char: "度"
    readings: "ど"
    meaning: "Степень, раз, градус"
    examples:
      - kanji: "今度"
        reading: "こんど"
        meaning: "В следующий раз, на этот раз"
      - kanji: "度"
        reading: "ど"
        meaning: "Градус, степень"
      - kanji: "一度"
        reading: "いちど"
        meaning: "Один раз"
