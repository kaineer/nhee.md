page:
  title: "Повседневная жизнь"
  type: "kanji"

kanji:
  - char: "活"
    readings: "かつ"
    meaning: "Жизнь, активность"
    examples:
      - kanji: "生活"
        reading: "せいかつ"
        meaning: "Жизнь, быт"
      - kanji: "活動"
        reading: "かつどう"
        meaning: "Деятельность, активность"
      - kanji: "活発"
        reading: "かっぱつ"
        meaning: "Активный, оживлённый"

  - char: "回"
    readings: "まわ, まわ, かい"
    meaning: "Крутить, раз, оборот"
    examples:
      - kanji: "回します"
        reading: "まわします"
        meaning: "Вращать, поворачивать"
      - kanji: "1回"
        reading: "いっかい"
        meaning: "Один раз"
      - kanji: "前回"
        reading: "ぜんかい"
        meaning: "В прошлый раз"
      - kanji: "今回"
        reading: "こんかい"
        meaning: "В этот раз, сейчас"

  - char: "主"
    readings: "おも, ぬし, しゅ"
    meaning: "Главный, основной, хозяин"
    examples:
      - kanji: "主人"
        reading: "しゅじん"
        meaning: "Муж, хозяин"
      - kanji: "主食"
        reading: "しゅしょく"
        meaning: "Основной продукт питания"
      - kanji: "主な"
        reading: "おもな"
        meaning: "Главный, основной"
      - kanji: "持ち主"
        reading: "もちぬし"
        meaning: "Владелец, собственник"

  - char: "色"
    readings: "いろ, しょく, しき"
    meaning: "Цвет"
    examples:
      - kanji: "色"
        reading: "いろ"
        meaning: "Цвет"
      - kanji: "茶色"
        reading: "ちゃいろ"
        meaning: "Коричневый"
      - kanji: "特色"
        reading: "とくしょく"
        meaning: "Особенность, характеристика"
      - kanji: "景色"
        reading: "けしき"
        meaning: "Пейзаж, вид"

  - char: "形"
    readings: "かたち, ぎょう, けい"
    meaning: "Форма"
    examples:
      - kanji: "形"
        reading: "かたち"
        meaning: "Форма"
      - kanji: "人形"
        reading: "にんぎょう"
        meaning: "Кукла"
      - kanji: "正方形"
        reading: "せいほうけい"
        meaning: "Квадрат"
      - kanji: "図形"
        reading: "ずけい"
        meaning: "Геометрическая фигура"

  - char: "犬"
    readings: "いぬ, けん"
    meaning: "Собака"
    examples:
      - kanji: "犬"
        reading: "いぬ"
        meaning: "Собака"
      - kanji: "子犬"
        reading: "こいぬ"
        meaning: "Щенок"
      - kanji: "日本犬"
        reading: "にほんけん"
        meaning: "Японская собака (порода)"

  - char: "民"
    readings: "みん"
    meaning: "Народ, жители"
    examples:
      - kanji: "国民"
        reading: "こくみん"
        meaning: "Граждане страны, народ"
      - kanji: "市民"
        reading: "しみん"
        meaning: "Горожанин, гражданин"
      - kanji: "民族"
        reading: "みんぞく"
        meaning: "Нация, народ"

  - char: "服"
    readings: "ふく"
    meaning: "Одежда"
    examples:
      - kanji: "服"
        reading: "ふく"
        meaning: "Одежда"
      - kanji: "洋服"
        reading: "ようふく"
        meaning: "Западная одежда"
      - kanji: "和服"
        reading: "わふく"
        meaning: "Японская одежда"
      - kanji: "制服"
        reading: "せいふく"
        meaning: "Униформа, форма"
      - kanji: "洋服"
        reading: "ようふく"
        meaning: "Западная одежда"

  - char: "品"
    readings: "しな, ひん"
    meaning: "Товар, вещь, качество"
    examples:
      - kanji: "品物"
        reading: "しなもの"
        meaning: "Товар, вещи"
      - kanji: "食料品"
        reading: "しょくりょうひん"
        meaning: "Продукты питания"
      - kanji: "作品"
        reading: "さくひん"
        meaning: "Произведение, работа"
      - kanji: "食品"
        reading: "しょくひん"
        meaning: "Продукты питания"

  - char: "同"
    readings: "おな, どう"
    meaning: "Одинаковый, тот же"
    examples:
      - kanji: "同じ"
        reading: "おなじ"
        meaning: "Одинаковый, такой же"
      - kanji: "同時に"
        reading: "どうじに"
        meaning: "Одновременно"
      - kanji: "同級生"
        reading: "どうきゅうせい"
        meaning: "Одноклассник"

