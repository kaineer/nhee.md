page:
  title: "Ключи"
  type: "kanji"

kanji:
  - char: "代"
    readings: "か, だい, たい"
    meaning: "Заменять, поколение"
    examples:
      - kanji: "代わります"
        reading: "かわります"
        meaning: "Заменять (кого-то), сменяться"
      - kanji: "代わりに"
        reading: "かわりに"
        meaning: "Вместо"
      - kanji: "時代"
        reading: "じだい"
        meaning: "Эпоха, период"
      - kanji: "ガス代"
        reading: "ガスだい"
        meaning: "Плата за газ"
      - kanji: "古代"
        reading: "こだい"
        meaning: "Древность, древний век"

  - char: "使"
    readings: "つか, し"
    meaning: "Использовать"
    examples:
      - kanji: "使います"
        reading: "つかいます"
        meaning: "Использовать"
      - kanji: "大使館"
        reading: "たいしかん"
        meaning: "Посольство"
      - kanji: "使用中"
        reading: "しようちゅう"
        meaning: "Занято (кто-то использует)"
      - kanji: "つかいます"
        reading: "つかいます"
        meaning: "Использовать"

  - char: "作"
    readings: "つく, さく, さっ, さ"
    meaning: "Делать, создавать"
    examples:
      - kanji: "作ります"
        reading: "つくります"
        meaning: "Делать, создавать"
      - kanji: "作文"
        reading: "さくぶん"
        meaning: "Сочинение, эссе"
      - kanji: "作家"
        reading: "さっか"
        meaning: "Писатель, автор"
      - kanji: "作業"
        reading: "さぎょう"
        meaning: "Работа, операция"
      - kanji: "つくります"
        reading: "つくります"
        meaning: "Делать, создавать"

  - char: "化"
    readings: "か"
    meaning: "Превращать, изменять"
    examples:
      - kanji: "変化します"
        reading: "へんかします"
        meaning: "Меняться, изменяться"
      - kanji: "文化"
        reading: "ぶんか"
        meaning: "Культура"
      - kanji: "化学"
        reading: "かがく"
        meaning: "Химия"
      - kanji: "映画化"
        reading: "えいがか"
        meaning: "Экранизация (превращение в фильм)"

  - char: "信"
    readings: "しん"
    meaning: "Верить, доверять"
    examples:
      - kanji: "信じる"
        reading: "しんじる"
        meaning: "Верить"
      - kanji: "信号"
        reading: "しんごう"
        meaning: "Сигнал, светофор"
      - kanji: "自信"
        reading: "じしん"
        meaning: "Уверенность в себе"
      - kanji: "通信"
        reading: "つうしん"
        meaning: "Связь, коммуникация"

  - char: "進"
    readings: "すす, しん"
    meaning: "Продвигаться, прогрессировать"
    examples:
      - kanji: "進みます"
        reading: "すすみます"
        meaning: "Продвигаться, прогрессировать"
      - kanji: "進歩"
        reading: "しんぽ"
        meaning: "Прогресс"
      - kanji: "先進国"
        reading: "せんしんこく"
        meaning: "Развитая страна"

  - char: "送"
    readings: "おく, そう"
    meaning: "Отправлять"
    examples:
      - kanji: "送ります"
        reading: "おくります"
        meaning: "Отправлять"
      - kanji: "送金"
        reading: "そうきん"
        meaning: "Денежный перевод"
      - kanji: "放送"
        reading: "ほうそう"
        meaning: "Трансляция, вещание"
      - kanji: "送信"
        reading: "そうしん"
        meaning: "Отправка сообщения, передача"
      - kanji: "回送"
        reading: "かいそう"
        meaning: "Обратный рейс, переадресация"

  - char: "返"
    readings: "かえ, へん"
    meaning: "Возвращать, отвечать"
    examples:
      - kanji: "返ります"
        reading: "かえります"
        meaning: "Возвращаться"
      - kanji: "返します"
        reading: "かえします"
        meaning: "Возвращать"
      - kanji: "返事"
        reading: "へんじ"
        meaning: "Ответ"
      - kanji: "返信"
        reading: "へんしん"
        meaning: "Ответ на сообщение (E-mail)"
      - kanji: "くり返します"
        reading: "くりかえします"
        meaning: "Повторять"

  - char: "洗"
    readings: "あら, せん"
    meaning: "Мыть, стирать"
    examples:
      - kanji: "洗います"
        reading: "あらいます"
        meaning: "Мыть, стирать"
      - kanji: "手洗い"
        reading: "てあらい"
        meaning: "Мытьё рук; туалет"
      - kanji: "お手洗い"
        reading: "おてあらい"
        meaning: "Туалет (вежливо)"
      - kanji: "洗濯"
        reading: "せんたく"
        meaning: "Стирка (одежды)"

  - char: "注"
    readings: "そそ, ちゅう"
    meaning: "Лить, обращать внимание"
    examples:
      - kanji: "注意します"
        reading: "ちゅういします"
        meaning: "Обращать внимание, быть осторожным"
      - kanji: "注文します"
        reading: "ちゅうもんします"
        meaning: "Заказывать"
      - kanji: "注射"
        reading: "ちゅうしゃ"
        meaning: "Инъекция, укол"
      - kanji: "注文"
        reading: "ちゅうもん"
        meaning: "Заказ"
      - kanji: "ちゅうい"
        reading: "ちゅうい"
        meaning: "Внимание, осторожность"

