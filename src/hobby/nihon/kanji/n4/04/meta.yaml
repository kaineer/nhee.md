page:
  title: "Прилагательные, 3"
  type: "kanji"

kanji:
  - char: "低"
    readings: "ひく, てい"
    meaning: "Низкий"
    examples:
      - kanji: "低い"
        reading: "ひくい"
        meaning: "Низкий"
      - kanji: "低下します"
        reading: "ていかします"
        meaning: "Падать, снижаться"

  - char: "広"
    readings: "ひろ, こう"
    meaning: "Широкий"
    examples:
      - kanji: "広い"
        reading: "ひろい"
        meaning: "Широкий"
      - kanji: "広場"
        reading: "ひろば"
        meaning: "Открытое пространство, площадь"
      - kanji: "広大"
        reading: "こうだい"
        meaning: "Обширный, огромный"

  - char: "短"
    readings: "みじか, たん"
    meaning: "Короткий"
    examples:
      - kanji: "短い"
        reading: "みじかい"
        meaning: "Короткий"
      - kanji: "短時間"
        reading: "たんじかん"
        meaning: "Короткое время"

  - char: "良"
    readings: "よ, りょう"
    meaning: "Хороший"
    examples:
      - kanji: "良い"
        reading: "よい"
        meaning: "Хороший"
      - kanji: "良心"
        reading: "りょうしん"
        meaning: "Совесть"

  - char: "悪"
    readings: "わる, あく"
    meaning: "Плохой"
    examples:
      - kanji: "悪い"
        reading: "わるい"
        meaning: "Плохой"
      - kanji: "悪人"
        reading: "あくにん"
        meaning: "Плохой человек, злодей"

  - char: "正"
    readings: "ただ, しょう, せい"
    meaning: "Правильный"
    examples:
      - kanji: "正しい"
        reading: "ただしい"
        meaning: "Правильный, верный"
      - kanji: "正月"
        reading: "しょうがつ"
        meaning: "Новый год"
      - kanji: "正門"
        reading: "せいもん"
        meaning: "Главные ворота"

  - char: "変"
    readings: "かわ, へん"
    meaning: "Изменение, странный"
    examples:
      - kanji: "変わります"
        reading: "かわります"
        meaning: "Меняться, изменяться"
      - kanji: "大変"
        reading: "たいへん"
        meaning: "Трудно, ужасно (очень)"
      - kanji: "変化します"
        reading: "へんかします"
        meaning: "Изменяться"

  - char: "赤"
    readings: "あか, せき"
    meaning: "Красный"
    examples:
      - kanji: "赤い"
        reading: "あかい"
        meaning: "Красный"
      - kanji: "赤ちゃん"
        reading: "あかちゃん"
        meaning: "Младенец, ребёнок"
      - kanji: "赤道"
        reading: "せきどう"
        meaning: "Экватор"

  - char: "青"
    readings: "あお, せい"
    meaning: "Синий, голубой"
    examples:
      - kanji: "青い"
        reading: "あおい"
        meaning: "Синий"
      - kanji: "青空"
        reading: "あおぞら"
        meaning: "Голубое небо"
      - kanji: "青春"
        reading: "せいしゅん"
        meaning: "Юность, молодость"

  - char: "黒"
    readings: "くろ, こく"
    meaning: "Чёрный"
    examples:
      - kanji: "黒い"
        reading: "くろい"
        meaning: "Чёрный"
      - kanji: "真っ黒"
        reading: "まっくろ"
        meaning: "Совершенно чёрный"
      - kanji: "黒板"
        reading: "こくばん"
        meaning: "Классная доска"
