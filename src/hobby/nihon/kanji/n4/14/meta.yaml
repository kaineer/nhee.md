page:
  title: "Еда"
  type: "kanji"

kanji:
  - char: "米"
    readings: "こめ"
    meaning: "Рис"
    examples:
      - kanji: "米"
        reading: "こめ"
        meaning: "Рис (крупа)"
      - kanji: "米国"
        reading: "べいこく"
        meaning: "США (Америка)"
      - kanji: "白米"
        reading: "はくまい"
        meaning: "Белый рис (шлифованный)"

  - char: "料"
    readings: "りょう"
    meaning: "Материал, плата, ингредиент"
    examples:
      - kanji: "料金"
        reading: "りょうきん"
        meaning: "Плата, тариф, стоимость"
      - kanji: "食料品"
        reading: "しょくりょうひん"
        meaning: "Продукты питания"
      - kanji: "資料"
        reading: "しりょう"
        meaning: "Материалы, данные, документы"
      - kanji: "材料"
        reading: "ざいりょう"
        meaning: "Материалы, ингредиенты"

  - char: "理"
    readings: "り"
    meaning: "Причина, логика, принцип"
    examples:
      - kanji: "料理"
        reading: "りょうり"
        meaning: "Кулинария, готовка; блюдо"
      - kanji: "地理"
        reading: "ちり"
        meaning: "География"
      - kanji: "無理"
        reading: "むり"
        meaning: "Невозможно, чрезмерно"
      - kanji: "理由"
        reading: "りゆう"
        meaning: "Причина"
      - kanji: "理事"
        reading: "りじ"
        meaning: "Директор, член правления"

  - char: "肉"
    readings: "にく"
    meaning: "Мясо"
    examples:
      - kanji: "肉"
        reading: "にく"
        meaning: "Мясо"
      - kanji: "牛肉"
        reading: "ぎゅうにく"
        meaning: "Говядина"
      - kanji: "肉屋"
        reading: "にくや"
        meaning: "Мясная лавка, мясник"
      - kanji: "筋肉"
        reading: "きんにく"
        meaning: "Мышца, мускул"

  - char: "鳥"
    readings: "とり, ちょう"
    meaning: "Птица"
    examples:
      - kanji: "鳥"
        reading: "とり"
        meaning: "Птица"
      - kanji: "小鳥"
        reading: "ことり"
        meaning: "Птичка"
      - kanji: "白鳥"
        reading: "はくちょう"
        meaning: "Лебедь"

  - char: "菜"
    readings: "な, さい"
    meaning: "Овощ, зелень"
    examples:
      - kanji: "野菜"
        reading: "やさい"
        meaning: "Овощи"
      - kanji: "採食"
        reading: "さいしょく"
        meaning: "Вегетарианская диета" # Примечание: на картинке написано 採食, но это опечатка, обычно 菜食
      - kanji: "青菜"
        reading: "あおな"
        meaning: "Зелёные листовые овощи"

  - char: "野"
    readings: "の, や"
    meaning: "Поле, открытая местность"
    examples:
      - kanji: "野原"
        reading: "のはら"
        meaning: "Поле, луг"
      - kanji: "野鳥"
        reading: "やちょう"
        meaning: "Дикая птица"
      - kanji: "分野"
        reading: "ぶんや"
        meaning: "Область, сфера (деятельности)"
      - kanji: "野菜"
        reading: "やさい"
        meaning: "Овощи"

  - char: "茶"
    readings: "ちゃ, さ"
    meaning: "Чай"
    examples:
      - kanji: "お茶"
        reading: "おちゃ"
        meaning: "Чай (зелёный)"
      - kanji: "茶色"
        reading: "ちゃいろ"
        meaning: "Коричневый цвет"
      - kanji: "喫茶店"
        reading: "きっさてん"
        meaning: "Кафе, кофейня"
      - kanji: "紅茶"
        reading: "こうちゃ"
        meaning: "Чёрный чай"

  - char: "飯"
    readings: "めし, はん"
    meaning: "Варёный рис, еда"
    examples:
      - kanji: "ご飯"
        reading: "ごはん"
        meaning: "Рис; еда"
      - kanji: "夕飯"
        reading: "ゆうはん"
        meaning: "Ужин"
      - kanji: "晩ご飯"
        reading: "ばんごはん"
        meaning: "Ужин"
      - kanji: "昼飯"
        reading: "ひるめし"
        meaning: "Обед (разг.)"
      - kanji: "夕飯"
        reading: "ゆうはん"
        meaning: "Ужин"

  - char: "味"
    readings: "あじ, み"
    meaning: "Вкус"
    examples:
      - kanji: "味"
        reading: "あじ"
        meaning: "Вкус"
      - kanji: "意味"
        reading: "いみ"
        meaning: "Значение, смысл"
      - kanji: "趣味"
        reading: "しゅみ"
        meaning: "Хобби, увлечение"
      - kanji: "興味"
        reading: "きょうみ"
        meaning: "Интерес"
