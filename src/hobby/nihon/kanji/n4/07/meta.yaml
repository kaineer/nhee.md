page:
  title: "Природа"
  type: "kanji"

kanji:
  - char: "林"
    readings: "はやし, りん"
    meaning: "Роща, лес"
    examples:
      - kanji: "林"
        reading: "はやし"
        meaning: "Роща, небольшой лес"
      - kanji: "森林"
        reading: "しんりん"
        meaning: "Лес"
      - kanji: "林道"
        reading: "りんどう"
        meaning: "Лесная дорога"

  - char: "森"
    readings: "もり, しん"
    meaning: "Лес"
    examples:
      - kanji: "森"
        reading: "もり"
        meaning: "Лес"
      - kanji: "森林"
        reading: "しんりん"
        meaning: "Лес"

  - char: "地"
    readings: "ち, じ"
    meaning: "Земля, почва"
    examples:
      - kanji: "地図"
        reading: "ちず"
        meaning: "Карта"
      - kanji: "地下"
        reading: "ちか"
        meaning: "Подземелье, под землёй"
      - kanji: "地下鉄"
        reading: "ちかてつ"
        meaning: "Метро"
      - kanji: "地球"
        reading: "ちきゅう"
        meaning: "Земля (планета)"
      - kanji: "土地"
        reading: "とち"
        meaning: "Земля, участок"
      - kanji: "地震"
        reading: "じしん"
        meaning: "Землетрясение"

  - char: "池"
    readings: "いけ, ち"
    meaning: "Пруд"
    examples:
      - kanji: "池"
        reading: "いけ"
        meaning: "Пруд"
      - kanji: "電池"
        reading: "でんち"
        meaning: "Батарейка"

  - char: "海"
    readings: "うみ, かい"
    meaning: "Море"
    examples:
      - kanji: "海"
        reading: "うみ"
        meaning: "Море"
      - kanji: "海外"
        reading: "かいがい"
        meaning: "За границей, за рубежом"

  - char: "洋"
    readings: "よう"
    meaning: "Океан, западный стиль"
    examples:
      - kanji: "東洋"
        reading: "とうよう"
        meaning: "Восток"
      - kanji: "洋食"
        reading: "ようしょく"
        meaning: "Западная еда"
      - kanji: "洋服"
        reading: "ようふく"
        meaning: "Западная одежда"
      - kanji: "洋室"
        reading: "ようしつ"
        meaning: "Комната в западном стиле"
      - kanji: "西洋"
        reading: "せいよう"
        meaning: "Западные страны, Запад"

  - char: "雪"
    readings: "ゆき, せつ"
    meaning: "Снег"
    examples:
      - kanji: "雪"
        reading: "ゆき"
        meaning: "Снег"
      - kanji: "大雪"
        reading: "おおゆき"
        meaning: "Сильный снегопад"
      - kanji: "新雪"
        reading: "しんせつ"
        meaning: "Свежевыпавший снег"

  - char: "光"
    readings: "ひか, こう"
    meaning: "Свет"
    examples:
      - kanji: "光"
        reading: "ひかり"
        meaning: "Свет"
      - kanji: "光ります"
        reading: "ひかります"
        meaning: "Светиться, сиять"
      - kanji: "日光"
        reading: "にっこう"
        meaning: "Солнечный свет"
      - kanji: "観光"
        reading: "かんこう"
        meaning: "Туризм, осмотр достопримечательностей"

  - char: "台"
    readings: "だい, たい"
    meaning: "Подставка, основание"
    examples:
      - kanji: "台"
        reading: "だい"
        meaning: "Подставка, стойка"
      - kanji: "台所"
        reading: "だいどころ"
        meaning: "Кухня"
      - kanji: "土台"
        reading: "どだい"
        meaning: "Фундамент, основание"
      - kanji: "台風"
        reading: "たいふう"
        meaning: "Тайфун"

  - char: "風"
    readings: "かぜ, ふう"
    meaning: "Ветер"
    examples:
      - kanji: "風"
        reading: "かぜ"
        meaning: "Ветер"
      - kanji: "台風"
        reading: "たいふう"
        meaning: "Тайфун"
      - kanji: "洋風"
        reading: "ようふう"
        meaning: "Западный стиль"
      - kanji: "風景"
        reading: "ふうけい"
        meaning: "Пейзаж, вид"
