page:
  title: "Глаголы, 1"
  type: "kanji"

kanji:
  - char: "止"
    readings: "と, し"
    meaning: "Останавливать"
    examples:
      - kanji: "止めます"
        reading: "とめます"
        meaning: "Останавливать"
      - kanji: "中止します"
        reading: "ちゅうしします"
        meaning: "Отменять, прекращать"
      - kanji: "一時停止"
        reading: "いちじていし"
        meaning: "Знак «Стоп», временная остановка"
      - kanji: "中止"
        reading: "ちゅうし"
        meaning: "Отмена, остановка"

  - char: "歩"
    readings: "ある, ほ, ぽ"
    meaning: "Идти, ходить"
    examples:
      - kanji: "歩きます"
        reading: "あるきます"
        meaning: "Идти пешком, ходить"
      - kanji: "散歩します"
        reading: "さんぽします"
        meaning: "Гулять, прогуливаться"
      - kanji: "進歩します"
        reading: "しんぽします"
        meaning: "Прогрессировать, делать успехи"

  - char: "走"
    readings: "はし, そう"
    meaning: "Бежать"
    examples:
      - kanji: "走ります"
        reading: "はしります"
        meaning: "Бежать"
      - kanji: "力走します"
        reading: "りきそうします"
        meaning: "Бежать изо всех сил"

  - char: "起"
    readings: "お"
    meaning: "Вставать, просыпаться"
    examples:
      - kanji: "起きます"
        reading: "おきます"
        meaning: "Вставать, просыпаться"
      - kanji: "早起き"
        reading: "はやおき"
        meaning: "Ранний подъём, «ранняя пташка»"
      - kanji: "起業家"
        reading: "きぎょうか"
        meaning: "Предприниматель"

  - char: "持"
    readings: "も, じ"
    meaning: "Держать, иметь"
    examples:
      - kanji: "もちます"
        reading: "もちます"
        meaning: "Держать, нести"
      - kanji: "気持ち"
        reading: "きもち"
        meaning: "Чувство, настроение"
      - kanji: "持ち物"
        reading: "もちもの"
        meaning: "Личные вещи, багаж"
      - kanji: "支持します"
        reading: "しじします"
        meaning: "Поддерживать"

  - char: "待"
    readings: "ま, たい"
    meaning: "Ждать"
    examples:
      - kanji: "待ちます"
        reading: "まちます"
        meaning: "Ждать"
      - kanji: "招待します"
        reading: "しょうたいします"
        meaning: "Приглашать"
      - kanji: "期待します"
        reading: "きたいします"
        meaning: "Ожидать, надеяться"

  - char: "借"
    readings: "か, しゃっ, しゃく"
    meaning: "Брать в долг, одалживать"
    examples:
      - kanji: "借ります"
        reading: "かります"
        meaning: "Брать взаймы, одалживать"
      - kanji: "借金"
        reading: "しゃっきん"
        meaning: "Долг"
      - kanji: "貸借"
        reading: "たいしゃく"
        meaning: "Аренда, заём"

  - char: "貸"
    readings: "か, たい"
    meaning: "Давать в долг, сдавать в аренду"
    examples:
      - kanji: "貸します"
        reading: "かします"
        meaning: "Одалживать, сдавать в аренду"
      - kanji: "貸家"
        reading: "かしや"
        meaning: "Дом в аренду"

  - char: "始"
    readings: "はじ, し"
    meaning: "Начинать"
    examples:
      - kanji: "始まります"
        reading: "はじまります"
        meaning: "Начинаться"
      - kanji: "開始します"
        reading: "かいしします"
        meaning: "Начинать, стартовать"
      - kanji: "始発"
        reading: "しはつ"
        meaning: "Первый поезд"

  - char: "終"
    readings: "お, しゅう"
    meaning: "Заканчивать"
    examples:
      - kanji: "終わります"
        reading: "おわります"
        meaning: "Заканчиваться"
      - kanji: "終電"
        reading: "しゅうでん"
        meaning: "Последний поезд"
      - kanji: "最終回"
        reading: "さいしゅうかい"
        meaning: "Финальный эпизод, последний выпуск"
