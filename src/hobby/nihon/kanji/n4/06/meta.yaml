page:
  title: "Профессии"
  type: "kanji"

kanji:
  - char: "仕"
    readings: "し"
    meaning: "Служить, работать"
    examples:
      - kanji: "仕事"
        reading: "しごと"
        meaning: "Работа"

  - char: "事"
    readings: "こと, じ"
    meaning: "Дело, вещь, обстоятельство"
    examples:
      - kanji: "事"
        reading: "こと"
        meaning: "Дело, обстоятельство"
      - kanji: "火事"
        reading: "かじ"
        meaning: "Пожар"
      - kanji: "用事"
        reading: "ようじ"
        meaning: "Дело, занятие"
      - kanji: "大事"
        reading: "だいじ"
        meaning: "Важный"
      - kanji: "食事"
        reading: "しょくじ"
        meaning: "Приём пищи, еда"

  - char: "銀"
    readings: "ぎん"
    meaning: "Серебро"
    examples:
      - kanji: "銀"
        reading: "ぎん"
        meaning: "Серебро"
      - kanji: "銀行"
        reading: "ぎんこう"
        meaning: "Банк"

  - char: "員"
    readings: "いん"
    meaning: "Член, сотрудник"
    examples:
      - kanji: "会社員"
        reading: "かいしゃいん"
        meaning: "Сотрудник компании"
      - kanji: "銀行員"
        reading: "ぎんこういん"
        meaning: "Сотрудник банка"
      - kanji: "店員"
        reading: "てんいん"
        meaning: "Продавец, клерк"
      - kanji: "会員"
        reading: "かいいん"
        meaning: "Член (организации)"
      - kanji: "全員"
        reading: "ぜんいん"
        meaning: "Все члены, все"
      - kanji: "駅員"
        reading: "えきいん"
        meaning: "Сотрудник станции"

  - char: "医"
    readings: "い"
    meaning: "Врач, медицина"
    examples:
      - kanji: "医者"
        reading: "いしゃ"
        meaning: "Врач"
      - kanji: "医学"
        reading: "いがく"
        meaning: "Медицина (наука)"
      - kanji: "医院"
        reading: "いいん"
        meaning: "Кабинет врача, клиника"

  - char: "働"
    readings: "はたら, どう"
    meaning: "Работать"
    examples:
      - kanji: "働きます"
        reading: "はたらきます"
        meaning: "Работать"
      - kanji: "活動"
        reading: "かつどう"
        meaning: "Деятельность, активность"

  - char: "者"
    readings: "しゃ, もの"
    meaning: "Человек, личность"
    examples:
      - kanji: "医者"
        reading: "いしゃ"
        meaning: "Врач"
      - kanji: "歯医者"
        reading: "はいしゃ"
        meaning: "Стоматолог"
      - kanji: "学者"
        reading: "がくしゃ"
        meaning: "Учёный"
      - kanji: "作者"
        reading: "さくしゃ"
        meaning: "Автор"
      - kanji: "者"
        reading: "もの"
        meaning: "Человек, личность"

  - char: "屋"
    readings: "や, おく"
    meaning: "Крыша, магазин"
    examples:
      - kanji: "本屋"
        reading: "ほんや"
        meaning: "Книжный магазин"
      - kanji: "部屋"
        reading: "へや"
        meaning: "Комната"
      - kanji: "屋上"
        reading: "おくじょう"
        meaning: "Крыша здания, терраса"

  - char: "産"
    readings: "う, さん"
    meaning: "Рожать, производить"
    examples:
      - kanji: "産みます"
        reading: "うみます"
        meaning: "Рожать, производить на свет"
      - kanji: "生産します"
        reading: "せいさんします"
        meaning: "Производить"
      - kanji: "財産"
        reading: "ざいさん"
        meaning: "Состояние, имущество, богатство"

  - char: "業"
    readings: "ぎょう"
    meaning: "Бизнес, отрасль, занятие"
    examples:
      - kanji: "産業"
        reading: "さんぎょう"
        meaning: "Промышленность, индустрия"
      - kanji: "工業"
        reading: "こうぎょう"
        meaning: "Производство, промышленность"
      - kanji: "授業"
        reading: "じゅぎょう"
        meaning: "Занятие, урок"
