  title_ru: Мокрые штаны (Оплошность)

paragraphs:
  - |
    ハルキは、授業中におもらしをしてしまいました。見つかったら、クラスのみんなに笑われてしまいます。そんなハルキを助けたのは、マリコでした。マリコはどうやってハルキを助けたのでしょうか？
  - |
    小学校3年生のハルキは、授業中に突然、自分の両足の間がぬれていることに気付きました。ズボンの前もぬれています。ハルキは、心臓が止まるかと思いました。クラスの男の子たちに見つかったら、いつまでも笑われてしまいます。女の子たちが知ったら、もう二度と話し掛けてくれないでしょう。
  - |
    ハルキは慌てました。「大変だ！　助けて！　どうしよう！」と、心の中で叫びました。顔を上げると、先生がハルキの方に近づいてきます。先生は、ハルキが何をしたのか分かっているようです。
  - |
    ちょうどそのとき、同じクラスのマリコが、先生の言いつけで、水が一杯に入った水槽を運んでいました。マリコは、クラスで飼っているメダカの水槽の水を交換していたのです。マリコは先生の前でつまずき、水槽の水を全部ハルキの膝に掛けてしまいました。ハルキは少し怒ったふりをしましたが、心の中では何回も「ありがとう！」と言っていました。
  - |
    おかげで、ハルキはクラスのみんなに笑われないで、同情されることになったのです。先生は急いでハルキを下の階に連れて行き、体操のときのズボンに着替えさせました。その間に、他の生徒たちが、ハルキの机と椅子や、その周りを拭いてくれました。
  - |
    学校が終わってから、ハルキはマリコの方に歩いて行って、小さな声で「さっきはどうもありがとう！　わざとやったんでしょ？」と聞きました。
    マリコも小声で、「私もおもらししたことがあるの」と答えました。

