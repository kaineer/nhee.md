page:
  title: "ペイフォワード"
  description: "Заплати вперед"
  type: "hanashi"

hanashi:
  title: ペイフォワード (Pay-it-forward)
  title_reading: ぺいふぉわーど
  title_ru: Пэй-ит-форвард («Заплати вперёд»)

paragraphs:
  - |
    アメリカのあるピザ屋ではピザを買うとき、もう1ドル払うと、他の人が無料で1枚ピザを食べられる。この方法は"Pay-it-forward"（＝先払い）と呼ばれている。「先払いのピザ」のいいところは、ピザが食べられるだけではない。その影響は……。
  - |
    メイソン・ウォートマンはウォール街での仕事を辞めて、故郷のフィラデルフィアで1枚1ドルのピザ屋を始めた。フィラデルフィアは大きな都市だが、アメリカで最も貧しい都市だった。
  - |
    ピザ屋を始めてから数カ月たったとき、一人の客がウォートマンに言った。「ピザ1枚分の代金を払っておくから、ホームレスのお客さんにピザを食べさせてあげて」
  - |
    ウォートマンは「先払いのピザの代金、1ドル」と付箋に書いて壁に貼っておいた。そして、次に来たホームレスの客にピザを1枚出した。もちろん、ホームレスの客からお金はもらわなかった。
  - |
    それから、この「先払いのピザ」について、他の客にも話してみた。たくさんの客がこのアイデアに賛成した。そして、いつからか分からないが、先払いする客が付箋にメッセージを書くようになった。
  - |
    「自信を持って」
    「楽しくピザを召し上がれ」
    「あなたのために」
    「よい一日を！」
  - |
    店の壁が温かいメッセージでいっぱいになった。ホームレスの客は無料でピザが1枚食べられるだけではなく、元気ももらえるのだ。
  - |
    こんなこともあった。よくピザを食べに来るホームレスの男性が、しばらくウォートマンの店に来なかった。ウォートマンが心配していると、ホームレスの男性がお店に来て、ピザの代金を先払いした。男性は「仕事が見つかった、今はホームレスではないんだ」と言った。男性は「先払いのピザ」のおかげで仕事が見つかったのだ。
  - |
    「先払いのピザ」の二つの問題――ホームレスの食事とお店の売り上げ――を同時に解決する方法です。もっとたくさんのレストランが同じことをしてくれれば、たくさんの人に食事をしてもらうことができると思います」とウォートマンは話している。
  - |
    また、ウォートマンはもっとたくさんのホームレスに食事を出すために、そして、自分のお店の売り上げを増やすために、ピザだけではなくTシャツも売り始めた。Tシャツを誰かが1枚買うと、フィラデルフィア市内の困っている人にTシャツが1枚寄付される。ウォートマンはこうした目的でもっと多くの商品を店で売る計画を立てている。
  - |
    現在、「ペイフォワード」はウォートマンのピザ屋だけでなく、アメリカ中のコーヒーやハンバーガーのお店にも広がっている。

