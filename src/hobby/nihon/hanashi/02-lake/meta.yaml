page:
  title: 湖になりなさい
  type: "hanashi"
  description: "みずうみになりなさい"

hanashi:
  title: 湖になりなさい
  title_reading: みずうみになりなさい
  title_ru: Стань озером

paragraphs:
  - |
    人生に悩んだ若者が、昔教わった教師の所へ相談に行きます。悩んでいる若者に、教師は塩の入った水を飲ませます。教師が若者に伝える、塩の意味とは……。
  - |
    ある所に、一人の不幸な若者がいました。彼は、自分がどうすればいいか、分からなくて悩んでいました。そこで、昔学校で教わった教師の所へ行って、自分がどんなに悲しい人生を送っているかを話しました。そして、それを変えるにはどうしたらいいか、尋ねました。
  - |
    年老いた教師は、塩を少し取って、水の入ったコップに入れました。そしてそれを飲むように若者に言いました。
  - |
    「味はどうだ？」と教師は尋ねました。
    「ひどいです」と若者は首を振りながら答えました。
    教師は笑って、もう一度塩を少し取りました。そして今度はそれを湖に入れるように若者に言いました。二人は何も話をしないで、近くの湖まで行きました。湖に着くと、若者は塩を湖に投げました。
  - |
    「湖の水を飲んでみなさい」と教師は言いました。若者は湖の水を少し飲みました。
    「味はどうだ？」
    「おいしいです」
    「塩の味はするかい？」
    「いいえ」
  - |
    教師は、若者の隣に座りました。そして、若者の手を取って言いました。
    「人生での苦しさは、塩と同じだ。それ以上でもそれ以下でもない。苦しさの量はいつも同じで、変わらない。しかし、苦しさの感じ方は、入れ物によって変わる。君が人生の苦しさを感じたときにできることは、物事を広く見ることだ。コップではなく、湖になりなさい」

