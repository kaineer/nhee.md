page:
  type: "hanashi"
  title: "2月14日はバラの花を"
  description: "Розы на Святого Валентина"

hanashi:
  title: 2月14日はバラの花を
  title_reading: にがつじゅうよっかはばらのはなを
  title_ru: 14 февраля — розы

paragraphs:
  - |
    ある新聞社が、バレンタインデーに本当にあった話を募集しました。新聞社にたくさんの手紙が届きました。その中からスーザン・パーカーの話が選ばれて、その年の2月14日の新聞で紹介されました。さて、それはどんな話でしょうか。
  - |
    結婚してから約50年たった頃、夫のジョンが亡くなりました。夫は亡くなるその日まで私に優しくしてくれました。私たちは、まるで親友のように過ごしていました。一緒に映画を見に行ったり、近所を散歩したりするのが大好きでした。夫は歩くとき、いつも私と手をつないでくれて、いつも幸せな気分にしてくれました。
  - |
    2月14日のバレンタインデーには、毎年、夫は街の花屋に寄って、12本のバラの花束を買ってくれました。バラの花束には「昨日よりも今日、もっと君を愛しているよ」と書いてあるカードが必ず入っていました。
  - |
    そしてある日突然、夫は旅立ちました。子どもたちが家に帰って来てくれて、しばらくの間は私のそばにいてくれました。しかし、数週間後にはそれぞれの家庭や仕事に戻って行きました。私は独りぼっちになりましたが、夫がいなくても生きていけるように努力しました。
  - |
    独りぼっちで迎える最初のバレンタインデーがやってきました。
    そろそろお昼ご飯の支度をしようと思ったとき、玄関のチャイムが鳴りました。ドアを開けると、街の花屋さんが花束を持って立っていました。花屋さんはバラの花束と小さなカードを差し出して「ご主人からです」と言ったのです。私は驚きました。そして、次の瞬間、怒りを感じました。
  - |
    私は冷静に「これは何かの冗談ですか？　だったら、ずいぶん悪い冗談だと思いませんか？」と言いました。すると、花屋さんは「いいえ、冗談ではありません」と言いました。そして、こう言ったのです。
  - |
    「ご主人はお客様になる前にお店にいらっしゃって、バレンタインデーに、毎年、必ず奥様に12本のバラの花束をお届けするようにと、バラの代金を何年分も前払いなさったのです」
  - |
    私はバラの花束とカードを受け取りました。カードにはこう書かれていました。
    「昨日よりも今日、もっと君を愛しているよ」

