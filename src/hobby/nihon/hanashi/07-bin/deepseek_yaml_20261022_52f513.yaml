title: あなたはビンに何を入れますか？
title_reading: あなたはびんになにをいれますか
title_ru: Что вы положите в банку?

paragraphs:
  - |
    ある大学の先生が、ビンに大きい石や小さい石、砂を入れて、ビンがいっぱいかどうか学生に質問しています。どうしてそんな質問をするのでしょう。先生が学生に伝えたいこととは……。
  - |
    大学の先生が教室で学生たちの前に立っています。先生の前には、とても大きなビンと、石や砂の入った箱が置いてあります。授業が始まると、先生は何も言わずに、ビンの中に大きい石をいくつも入れて、ビンをいっぱいにしました。そして先生は学生に「ビンは今、いっぱいですか？」と尋ねました。学生たちは「はい」と答えました。
  - |
    次に先生は、少し小さい石の入った箱を取って、石をビンの中に入れました。そしてビンを軽く振りました。もちろん小さい石は大きい石の間を通って、ビンの下の方に落ちて行きます。先生はまた学生たちに聞きました。「ビンは今、いっぱいですか？」と。学生たちは「はい」と答えました。
  - |
    今度は、先生は砂の入った箱を取って、砂をビンの中に入れました。もちろん、砂は大きい石と小さい石の間を通って、ビンの下の方に落ちて行きました。そして先生はまた「ビンは今、いっぱいですか？」と尋ねました。学生たちは「はい」と答えました。
  - |
    「さて……」と先生が言いました。「この石の入ったビンは、あなたたちの人生によく似ています。大きい石は大切なもので、例えば家族や両親、健康や子どもたちです。もし他のものがなくても、これさえあれば人生は大丈夫だと思えるようなものです。少し小さい石は、次に大事なものです。例えば、仕事や家、車のように。そして砂は、その他のどうでもいいものです」
  - |
    「もし君たちがビンの中に最初に砂を入れてしまったら……」と先生は続けました。「大きい石や、小さい石を入れるスペースがなくなってしまいます。人生も同じです。将来、もし君たちがどうでもいいことをするために時間やエネルギーを全部使ってしまったら、大事なことをする力は残らなくなってしまうでしょう。君たちの幸せにとって、何が一番大切なのか、よく考えなさい。子どもと遊んだり、夫婦で出かけたり、自分の健康に注意したりする。これは、大切なことです。仕事に行ったり、家を掃除したり、パーティーに行ったり、台所の修理をしたりすることは、いつでもできます。まず、大きな石、つまり本当に大事なものを大切にしなさい。そして、君たちにとって大事なものに、順番を付けるのです。残りはただの砂なんだから」

