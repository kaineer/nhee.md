page:
  type: "hanashi"
  title: "コップを置いて"
  description: "こっぷをおいて"

hanashi:
  title: コップを置いて
  title_reading: こっぷをおいて
  title_ru: Поставь стакан

paragraphs:
  - |
    あなたは心配していることや、嫌なことなどをずっと頭の中で考えてしまいますか？　ずっと考えていたら、疲れませんか？　それは水が入っているコップをずっと持つようなものなのです。疲れないためには……。
  - |
    ある先生が、ストレスの管理について話していました。先生は水の入っているコップを見せて「みなさん、このコップは軽いですか。重いですか」と学生に聞きました。学生は「軽い」「重くない」「ちょっと重い」「軽くない」「重い」「とても軽い」など、さまざまな答えを言いました。先生が話を続けました。
  - |
    「このコップが軽いか重いか。実はコップの重さとは関係ありません。コップを持っている時間の長さで、軽いか重いかが決まります。もし、1分だけなら、持っていられますよね。では、1時間持っていられますか？　1日中、ずっとは持っていられないでしょう。持っている時間が長ければ長いほど、コップは重く感じるようになるのです」
  - |
    「今、あなたが困っていること、相談したいこと、悩んでいることも、このコップの水と同じです。あなたがずっと自分の問題について考えていたら、疲れて、嫌になってしまいでしょう。そんなときは、コップを置いて少し休みましょう。少し休んで、もう一度持ち上げればいいんです」
  - |
    困っているとき、悩んでいるときに、元気になって、また人生を歩き続けることができるように、私たちはときどき休まなければなりません。ですから、心配していること、困ったこと、嫌なことをときどき頭から消して、リラックスする時間を毎日作るようにしましょう。

